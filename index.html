<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lotus Table – Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Noto+Sans+Khmer:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ea;--card:#fffdf8;--ink:#1b2420;--mute:#66726c;--line:#e4dfd0;--pine:#143a33;--amber:#e8a21a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#18241f;--ink:#e9efeb;--mute:#93a39c;--line:#2a3a34;--pine:#0a1f1b}}
:root[data-theme="dark"]{--bg:#0f1815;--card:#18241f;--ink:#e9efeb;--mute:#93a39c;--line:#2a3a34;--pine:#0a1f1b}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque","Noto Sans Khmer",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{background:var(--pine);color:#eef3ef;padding:22px 18px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}header p{margin:2px 0 0;opacity:.8;font-size:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:20px;padding:8px 14px;font-weight:600}
#lang{background:var(--amber);color:#1b1405}
.tb{display:inline-block;margin-top:8px;background:#ffffff22;border-radius:20px;padding:2px 12px;font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto}
nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:600;font-size:14px}
nav a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:14px}
#q{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:6px}
h2{font-size:22px;margin:26px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--amber);display:flex;justify-content:space-between;align-items:baseline}h2 small{font-size:13px;color:var(--mute);font-weight:400}
.it{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.em{flex:none;width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}
.nm{flex:1}.nm b{display:block;font-weight:600}.nm span{color:var(--mute);font-size:14px}
.pr{text-align:right;white-space:nowrap}.pr b{display:block;font-size:17px}.pr span{color:var(--mute);font-size:13px}
.note{color:var(--mute);font-size:13px;margin:6px 0 0}.empty{color:var(--mute);padding:24px 0;text-align:center}
.ph{flex:none;width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--card)}.ds{margin:4px 0 0;color:var(--mute);font-size:13px;line-height:1.4}
footer{padding:22px 18px 34px;text-align:center;color:var(--mute);font-size:13px}
</style></head><body>
